name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Assemble and build
        run: |
          ./build/assemble.sh
          dotnet build upstream/Jellyfin.Plugin.Pgsql/Jellyfin.Plugin.Pgsql.csproj -c Release

      - uses: github/codeql-action/analyze@v3
