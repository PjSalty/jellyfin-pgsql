name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Assemble from upstream
        run: ./build/assemble.sh

      - name: Publish plugin
        run: dotnet publish upstream/Jellyfin.Plugin.Pgsql/Jellyfin.Plugin.Pgsql.csproj -c Release -o upstream/publish

      - name: Smoke test
        run: ./tests/smoke.sh

      - name: Package
        run: |
          cd upstream/publish
          zip -r "../../jellyfin-pgsql-${GITHUB_REF_NAME}.zip" .
          cd ../..
          sha256sum "jellyfin-pgsql-${GITHUB_REF_NAME}.zip" > SHA256SUMS

      - name: Changelog for this tag
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            jellyfin-pgsql-*.zip
            SHA256SUMS
