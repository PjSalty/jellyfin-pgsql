name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # The same three steps pre-commit/action v3.0.1 runs, inline: that
      # composite calls actions/cache by tag, which SHA-pinning enforcement
      # rejects, and it has no release that pins it.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Assemble from upstream
        run: ./build/assemble.sh

      - name: Publish plugin
        run: dotnet publish upstream/Jellyfin.Plugin.Pgsql/Jellyfin.Plugin.Pgsql.csproj -c Release -o upstream/publish

      - name: Smoke test
        run: ./tests/smoke.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jellyfin-pgsql-plugin
          path: upstream/publish
          retention-days: 14
