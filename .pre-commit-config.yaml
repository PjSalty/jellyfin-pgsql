# Local hygiene hooks; CI runs the same set (ci.yml pre-commit step).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # patches/ carries git-format-patch output where trailing whitespace
      # (diff context, the "-- " signature line) is semantic; "fixing" it
      # breaks git am.
      - id: end-of-file-fixer
        exclude: ^patches/.*\.patch$
      - id: trailing-whitespace
        exclude: ^patches/.*\.patch$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # "cache" is this repo's extra commit type (see CONTRIBUTING.md, cliff.toml)
        args: [cache]
