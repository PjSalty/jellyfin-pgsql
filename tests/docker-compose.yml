services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jellyfin
      POSTGRES_USER: jellyfin
      POSTGRES_PASSWORD: smoketest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfin"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.1-alpine
    command:
      - valkey-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  jellyfin:
    # Built from our Dockerfile, not the stock image: the provider needs
    # pg_dump/psql in the container (migration backups at first boot).
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: jellyfin-pgsql-smoke:local
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jellyfin
      POSTGRES_USER: jellyfin
      POSTGRES_PASSWORD: smoketest
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      CACHE_ENABLED: "true"
      # CACHE_DEBUG stays OFF here: per-statement cache events during the
      # first-boot migrations flood Serilog's bounded async console queue,
      # which then DROPS lines (including the one-time enable line the smoke
      # asserts on). The smoke's cache checks are functional, not log-based.
      CACHE_DEBUG: "false"
    volumes:
      - ../upstream/publish:/config/plugins/PostgreSQL
      - ./database.xml:/config/config/database.xml
      - media:/media:ro
    ports:
      - "8096:8096"

volumes:
  media:
